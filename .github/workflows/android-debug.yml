name: Android debug APK

# Builds a signed debug APK you can install on a phone.
# Download it from the run's "Artifacts" section.

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The repo has no gradlew script (Google AI Studio leaves it out),
      # so install the Gradle version that gradle-wrapper.properties names.
      - name: Read Gradle version
        id: versions
        run: |
          version=$(sed -n 's/^distributionUrl=.*gradle-\(.*\)-bin\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$version" ]; then
            echo "::error::No Gradle version in gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          echo "gradle=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle ${{ steps.versions.outputs.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.versions.outputs.gradle }}

      # Lets the Android Gradle Plugin download the exact SDK platform the app compiles against
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The debug signing key must stay the same between builds, or Android refuses to
      # update the installed app. Best: store one as the DEBUG_KEYSTORE_BASE64 secret
      # (base64 -w0 debug.keystore). Without it, a generated key is kept in the Actions cache.
      - name: Restore cached debug keystore
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Prepare debug keystore
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "source=secret" >> "$GITHUB_OUTPUT"
          elif [ -f debug.keystore ]; then
            echo "source=cache" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "::warning::Generated a new debug signing key. If an older build is installed, uninstall it first. Set the DEBUG_KEYSTORE_BASE64 secret to keep one key."
          fi

      # Never cache a key that came from the secret
      - name: Cache generated debug keystore
        if: steps.keystore.outputs.source == 'generated'
        uses: actions/cache/save@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleStockPulse-debug-${{ steps.versions.outputs.short_sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ steps.versions.outputs.short_sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write summary
        if: success()
        run: |
          {
            echo "### AppleStockPulse debug APK"
            echo ""
            echo "- Commit: \`${{ steps.versions.outputs.short_sha }}\`"
            echo "- Signing key: ${{ steps.keystore.outputs.source }}"
            echo "- Download **AppleStockPulse-debug-${{ steps.versions.outputs.short_sha }}** from Artifacts, unzip it, and open \`app-debug.apk\` on the phone."
            echo "- After install: allow notifications, tap **Setup** on the battery banner, then tap **Start**."
          } >> "$GITHUB_STEP_SUMMARY"
